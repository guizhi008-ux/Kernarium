name: CI build check (fork)
on:
  workflow_dispatch:
jobs:
  check-unit:
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          cmake --version
          ninja --version
      - name: Prepare dependencies (macos product)
        run: ./dependencies/prepare.sh --product macos
      - name: Install build tools
        run: brew install meson ninja pkg-config autoconf automake libtool gettext groff
      - name: Build dependency prefix
        run: UML_DEPENDENCY_JOBS=3 ./dependencies/build.sh
      - name: Configure, build and test (check-unit)
        run: cmake --workflow --preset check-unit
